name: "Build VRShizuku APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-vrshizuku:
    name: "Compile Android VR Package"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Install Gradle 8.4"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: "Build Release APK"
        # We add --stacktrace and --info to see exactly why it is failing
        run: gradle assembleRelease --stacktrace --info

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: "VRShizuku-Release-APK"
          path: "app/build/outputs/apk/release/app-release.apk"
          retention-days: 30
