name: "Build VRShizuku Signed Release APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-vrshizuku:
    name: "Compile Signed Android VR Package"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Accept Android SDK Licenses"
        run: |
          yes | sdkmanager --licenses || true

      - name: "Generate Release Keystore and Properties"
        run: |
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias keyalias -dname "CN=Android, OU=Android, O=Android, L=City, ST=State, C=US" -storepass password123 -keypass password123
          
          # Enable AndroidX properties required for dependencies
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: "Install Gradle Directly"
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$(pwd)/gradle-8.4/bin" >> $GITHUB_PATH

      - name: "Build Signed Release APK"
        run: gradle assembleRelease --stacktrace

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "VRShizuku-Signed-Release-APK"
          path: "app/build/outputs/apk/release/app-release.apk"
          retention-days: 30
