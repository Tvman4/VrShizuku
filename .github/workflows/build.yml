name: "Build VRShizuku Signed Release APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-vrshizuku:
    name: "Compile Signed Android VR Package"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Accept Android SDK Licenses"
        run: |
          yes | sdkmanager --licenses || true

      - name: "Generate Keystore and Configure Build"
        run: |
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias keyalias -dname "CN=Android, OU=Android, O=Android, L=City, ST=State, C=US" -storepass password123 -keypass password123
          
          python3 -c "
          path = 'app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file('keystore.jks')
                      storePassword 'password123'
                      keyAlias 'keyalias'
                      keyPassword 'password123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''

          if 'signingConfigs' not in content:
              content = content.replace('android {', 'android {' + signing_block, 1)
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: "Install Gradle 8.4"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: "Build Signed Release APK"
        run: gradle assembleRelease --stacktrace

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "VRShizuku-Signed-Release-APK"
          path: "app/build/outputs/apk/release/app-release.apk"
          retention-days: 30
